<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Stimuli</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --black-cherry: #1d0c17;
                --off-white: #f1f0ec;
                --gray-70: #594e53;
                --gray-60: #746a6e;
                --gray-30: #b9b2b4;
                --gray-20: #cfcbcc;
                --gray-10: #e7e5e5;
                --medium-pink: #cf0090;
                --purple: #820076;
            }

            * {
                box-sizing: border-box;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--off-white);
            }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                background: var(--off-white);
                color: var(--black-cherry);
                font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 420px;
                padding: 32px;
                margin: auto;
            }

            .staticrypt-form {
                background: var(--off-white);
                border: 1px solid var(--gray-20);
                border-radius: 16px;
                max-width: 420px;
                margin: 0 auto;
                padding: 44px 40px;
                text-align: left;
                box-shadow: 0 12px 32px rgba(29, 12, 23, 0.07);
            }

            .staticrypt-instructions {
                margin: 0 0 28px;
            }

            .staticrypt-title {
                font-family: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial,
                    sans-serif;
                font-size: 30px;
                line-height: 1.12;
                font-weight: 600;
                letter-spacing: -0.015em;
                color: var(--black-cherry);
                margin: 0 0 16px;
            }

            /* single decorative pink moment — Medium Pink on Off-White only */
            .staticrypt-title::after {
                content: "";
                display: block;
                width: 44px;
                height: 4px;
                margin-top: 18px;
                border-radius: 2px;
                background: var(--medium-pink);
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                font-size: 15px;
                line-height: 1.55;
                color: var(--gray-70);
                margin: 0;
            }

            /* default divider not used — the pink rule handles separation */
            .staticrypt-hr {
                display: none;
            }

            .staticrypt-password-container {
                position: relative;
                background: #ffffff;
                border: 1px solid var(--gray-30);
                border-radius: 10px;
                width: 100%;
                margin: 0 0 16px;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--medium-pink);
                box-shadow: 0 0 0 3px rgba(207, 0, 144, 0.16);
            }

            /* error state: turn the input outline pink when there's a message */
            .staticrypt-password-container.staticrypt-has-error {
                border-color: var(--medium-pink);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                box-sizing: border-box;
                width: 100%;
                font-family: inherit;
                font-size: 16px;
                color: var(--black-cherry);
                padding: 16px 46px 16px 16px;
                border-radius: 10px;
            }

            .staticrypt-form input::placeholder {
                color: var(--gray-60);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 55%;
                padding: 14px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            /* inline error message — replaces the browser's native alert() so the
               origin (github.io) is never shown. Medium Pink on Off-White is AA-compliant. */
            .staticrypt-error {
                margin: -4px 0 16px;
                font-size: 14px;
                font-weight: 600;
                line-height: 1.4;
                color: var(--medium-pink);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: inherit;
                text-transform: none;
                font-weight: 600;
                font-size: 16px;
                letter-spacing: 0.01em;
                outline: 0;
                background: var(--purple);
                color: var(--off-white);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 16px;
                cursor: pointer;
                transition: filter 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active {
                background: var(--purple);
                filter: brightness(1.12);
            }

            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                outline: 3px solid var(--medium-pink);
                outline-offset: 2px;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                color: var(--gray-70);
                font-size: 14px;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.4);
                margin-right: 1em;
                accent-color: var(--purple);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--off-white);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--gray-30);
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
